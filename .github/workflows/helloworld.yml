name: Hello World

on:
  push: # se lance à chaque push
  workflow_dispatch: # permet aussi de la lancer à la main

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Dire bonjour
        run: echo "Hello World"

  name:
      runs-on: ubuntu-latest
      steps:
        - name: Afficher les infos utilisateur
          run: echo "Hello, ${{ var.NAME }} ${{ var.SURNAME }} (Email ${{ vars.EMAIL }})"
