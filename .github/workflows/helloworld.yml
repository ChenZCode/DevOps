name: Hello World

on:
  push: # se lance à chaque push
  workflow_dispatch: # permet aussi de la lancer à la main

  jobs:
    hello:
      runs-on: ubuntu-latest
      steps:
        - name: Dire bonjour
          run: echo "Hello World"

    name:
        runs-on: ubuntu-latest
        steps:
          - name: Dire bonjour à un nom
            run: echo "Hello, ${{ github.event.inputs.name }}"
            