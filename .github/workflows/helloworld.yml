name: exo 2

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  print-name:
    runs-on: ubuntu-latest
    steps:
      - name: Print env vars
        env:
          NAME: ${{ vars.NAME }}
          SURNAME: ${{ vars.SURNAME }}
          EMAIL: ${{ vars.EMAIL }}
        run: |
          echo "We are $NAME $SURNAME $EMAIL"